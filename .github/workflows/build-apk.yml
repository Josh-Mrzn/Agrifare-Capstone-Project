# Builds the Android app against the hosted API and commits it to
# frontend/public/downloads/AgriFair.apk, where the website's download button
# serves it. Vercel redeploys on that commit.
#
# Runs on every push to main that touches mobile/, or by hand from the
# Actions tab ("Build Android APK" -> Run workflow), where the API URL can be
# changed.
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Backend API URL baked into the app (must end with /api)
        default: https://agrifair-api.onrender.com/api
        required: true
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ inputs.api_url || 'https://agrifair-api.onrender.com/api' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check the API URL
        run: |
          case "$API_URL" in
            https://*/api) ;;
            *) echo "API URL must start with https:// and end with /api: $API_URL"; exit 1 ;;
          esac

      - name: Build release APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --dart-define=API_BASE_URL="$API_URL"

      - name: Keep the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgriFair-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish to the website's downloads
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-release.apk frontend/public/downloads/AgriFair.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/downloads/AgriFair.apk
          if git diff --cached --quiet; then
            echo "APK unchanged."
            exit 0
          fi
          git commit -m "Build AgriFair.apk for $API_URL"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
